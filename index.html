html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--font);font-size:15px;overflow:hidden;margin:0}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}
.ico{width:18px;height:18px;flex:0 0 auto;display:block}

.hud{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;background:var(--paper);border-bottom:2px solid var(--line);
  padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5}
.brand{font-weight:700;font-size:17px;white-space:nowrap;letter-spacing:-.01em;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:default}
.stats{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.chip{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px 10px;
  font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip .k{font-weight:400;color:var(--muted);font-size:13px}
.chip img{width:22px;height:22px;object-fit:contain}
.chip.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.12)}}
.dot{width:10px;height:10px;border-radius:50%}
.level{display:flex;align-items:center;gap:8px;white-space:nowrap}
.level b{background:var(--sun);color:#3a2700;border-radius:8px;padding:2px 9px;font-size:14px}
.xpbar{width:90px;height:8px;border-radius:99px;background:#efe3c3;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--sun);transition:width .4s}

.stage{position:relative;flex:1;min-height:0}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--muted)}
.wishes{position:absolute;top:10px;left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;width:min(290px,calc(100% - 90px));pointer-events:none}
.wishes h3{margin:0;font-size:13px;color:#3e4a45;font-weight:400;text-shadow:0 1px 0 #fff}
.wish{pointer-events:auto;display:flex;gap:6px;align-items:flex-start}
.wish img{width:62px;height:62px;border-radius:50%;object-fit:cover;object-position:50% 8%;background:#fbe9d6;border:3px solid #fff;box-shadow:0 2px 6px rgba(40,50,40,.25);flex:0 0 auto}
.wish .wb{position:relative;background:#fff;border:2px solid #e2a35a;border-radius:14px;padding:6px 11px 7px;box-shadow:0 2px 8px rgba(40,50,40,.15);margin-top:4px}
.wish .wb:before{content:"";position:absolute;left:-9px;top:14px;border:7px solid transparent;border-right-color:#e2a35a;border-left:0}
.wish .wb b{display:block;font-size:12px;color:#b5651d}
.wish p{margin:0;font-size:14px;line-height:1.4}
.wish em{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px}
.wish.thx .wb{border-color:var(--pine)}.wish.thx .wb:before{border-right-color:var(--pine)}.wish.thx .wb b{color:var(--pine)}
.wish.new{animation:wpop .5s cubic-bezier(.2,1.5,.4,1)}@keyframes wpop{from{transform:scale(.6) translateY(-10px);opacity:0}to{transform:none;opacity:1}}
.tools{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:10px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.compass{width:58px;height:58px;border-radius:50%;background:var(--paper);border:1px solid var(--line);box-shadow:0 2px 6px rgba(40,50,40,.12)}
.zoom{display:flex;flex-direction:column;gap:6px}
.zoom button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:22px;line-height:1}
.mini{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 2px 6px rgba(40,50,40,.12)}
.mini canvas{display:block;width:180px;height:96px;cursor:pointer;touch-action:none}
.mini span{position:absolute;top:4px;left:8px;font-size:11px;color:var(--muted)}
.arrow{position:absolute;width:52px;height:52px;border-radius:14px;border:0;background:rgba(30,40,35,.55);color:#fff;font-size:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;touch-action:none;user-select:none;-webkit-user-select:none}
.arrow svg{width:18px;height:18px}
.ar-n{top:10px;left:50%;transform:translateX(-50%)}
.ar-s{bottom:12px;left:50%;transform:translateX(-50%)}
.ar-w{left:max(8px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%)}
.ar-e{right:max(8px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%)}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:10px;padding:8px 14px;font-size:14px;
  max-width:calc(100% - 32px);text-align:center;pointer-events:none;opacity:0;transition:opacity .25s;z-index:6}
.toast.show{opacity:1}
.toolhint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:var(--paper);
  border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 14px;font-size:14px;white-space:nowrap;box-shadow:0 2px 6px rgba(40,50,40,.15)}
.toolhint button{border:0;background:var(--paper2);border-radius:999px;padding:5px 12px}
.elder{position:absolute;left:8px;bottom:0;display:flex;gap:4px;align-items:flex-end;max-width:min(620px,calc(100% - 16px));z-index:20;pointer-events:none}
.elder>*{pointer-events:auto}
.elder img{height:min(230px,34vh);width:auto;flex:0 0 auto;filter:drop-shadow(0 4px 8px rgba(30,40,30,.35));animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.elder .bubble{margin-bottom:min(110px,16vh);font-size:16px;position:relative}
.elder .bubble:before{content:"";position:absolute;left:-10px;bottom:22px;border:8px solid transparent;border-right-color:var(--pine)}
.elder .bubble b{font-size:13px}
@keyframes pop{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.bubble{background:var(--paper);border:2px solid var(--pine);border-radius:14px;padding:10px 12px;font-size:15px;line-height:1.5;box-shadow:0 2px 8px rgba(40,50,40,.15)}
.bubble b{display:block;font-size:12px;color:var(--pine)}
.bubble button{margin-top:6px;border:0;background:var(--pine);color:#fff;border-radius:8px;padding:6px 14px;font-weight:700}
.info{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;width:min(320px,calc(100% - 24px));background:var(--paper);border:1px solid var(--line);
  border-radius:14px;padding:12px;box-shadow:0 4px 14px rgba(40,50,40,.18)}
.info h4{margin:0 0 2px;font-size:17px}
.info .sub{font-size:13px;color:var(--muted);margin-bottom:8px}
.info .x{position:absolute;top:8px;right:8px;border:0;background:var(--paper2);border-radius:8px;width:30px;height:30px;font-size:16px}
.up{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px;margin-top:8px;background:#fff;width:100%;text-align:left}

.up .t{display:flex;flex-direction:column;gap:2px;font-size:13px;min-width:0}
.up .t b{font-size:15px}
.up .need{color:var(--muted)}
.up .need.ok{color:var(--ok)}

.confirm{position:absolute;display:flex;gap:10px;transform:translate(-50%,0);z-index:4}
.confirm button{width:48px;height:48px;border-radius:50%;border:3px solid #fff;font-size:22px;font-weight:700;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#crot{background:#4f7fb8}#cok{background:var(--pine)}#cok[disabled]{background:#9aa79f}#cno{background:var(--alert)}

.tray img,.card img{-webkit-user-drag:none;user-select:none;pointer-events:none}
.tray{display:flex;gap:8px;overflow-x:auto;touch-action:pan-x;user-select:none;-webkit-user-select:none;flex:1;min-width:0;padding-bottom:2px}
.card{position:relative;flex:0 0 auto;width:100px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:4px 4px 5px;

.side{display:flex;gap:8px;align-items:stretch}

.opts{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.opts button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-size:15px}
.opts button.right{border-color:var(--pine);background:#e3f1e8}
.opts button.wrong{border-color:var(--alert);background:#fae8e3}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.row button{border:0;border-radius:10px;padding:8px 16px;font-weight:700;background:var(--pine);color:#fff}
.row button.ghost{background:var(--paper2);color:var(--ink);font-weight:400}
.note{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff}
.note h4{margin:0 0 4px;font-size:15px}
.note p{margin:0;font-size:14px}
.note.lockednote{background:var(--paper2);color:#9a917f}
.fine{font-size:12px;color:var(--muted)}
.qimg{display:block;margin:0 auto 8px;width:120px;height:100px;object-fit:contain}
@media (max-width:640px){
  .brand{font-size:15px;flex:1}
  .stats{order:3;flex-basis:100%;gap:4px}
  .chip{padding:2px 7px;font-size:13px;gap:4px}.chip .k{display:none}.chip img{width:18px;height:18px}
  .side #bookcount,.side #nextlbl,.side #evlbl{font-size:11px}
  .xpbar{width:56px}
  .card{width:86px}.card img{width:62px;height:48px}.card .nm{font-size:13px}

  .mini canvas{width:120px;height:64px}
  .elder{left:max(4px,env(safe-area-inset-left,0px));bottom:92px;max-width:calc(100% - 8px)}
  .elder img{height:150px}.elder .bubble{margin-bottom:60px;font-size:14px}
  .wishes{width:calc(100% - 90px)}
  .compass{width:46px;height:46px}
}
@media (max-width:640px),(max-height:500px){
  .side{flex-direction:column;gap:4px;width:84px;flex:0 0 84px}
  .side button{flex:1;flex-direction:row;gap:4px;min-width:0;max-width:none;width:100%;padding:3px 6px;font-size:11.5px;white-space:nowrap;border-radius:10px}
  .side svg{width:16px;height:16px;flex:0 0 16px}
  .side #bookcount,.side #nextlbl,.side #evlbl{font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
  #evbtn .evdot{top:3px;right:4px;width:7px;height:7px}
}

  el.hidden=false;let z=1;const w=$("bzw"),im=$("bzi");
  const set=(nz,cx,cy)=>{nz=Math.max(1,Math.min(4,nz));const r=w.getBoundingClientRect();cx=cx==null?r.width/2:cx;cy=cy==null?r.height/2:cy;const fx=(w.scrollLeft+cx)/(im.offsetWidth||1),fy=(w.scrollTop+cy)/(im.offsetHeight||1);z=nz;im.style.width=(z*100)+"%";$("bzl").textContent=(Math.round(z*10)/10)+"배";w.scrollLeft=fx*im.offsetWidth-cx;w.scrollTop=fy*im.offsetHeight-cy};
  $("bzp").onclick=()=>set(z+1);$("bzm").onclick=()=>set(z-1);$("bzx").onclick=()=>{el.hidden=true};
  el.onclick=e=>{if(e.target===el||e.target===w)el.hidden=true};
  im.ondblclick=e=>{const r=w.getBoundingClientRect();set(z>1?1:2,e.clientX-r.left,e.clientY-r.top)};
  let drag=null;const pts=new Map();let pinch=null;
  w.onpointerdown=e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z};drag=null}else if(e.pointerType==="mouse"){drag={x:e.clientX,y:e.clientY,sl:w.scrollLeft,st:w.scrollTop};w.setPointerCapture(e.pointerId)}};
  w.onpointermove=e=>{if(pts.has(e.pointerId))pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pinch&&pts.size===2){const [a,b]=[...pts.values()],r=w.getBoundingClientRect();set(pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top)}else if(drag){w.scrollLeft=drag.sl-(e.clientX-drag.x);w.scrollTop=drag.st-(e.clientY-drag.y)}};

function fxStep(now){const dt=Math.min(.1,(now-(fxLast||now))/1000);fxLast=now;const se=S?S.season:0,area=W*H/9e5;
  const want=se===0?Math.round(34*area):se===2?Math.round(30*area):se===3?Math.round(90*area):0;
  let n=FX.filter(f=>f.k!=="g").length;
  while(n<want){FX.push(se===3?{k:"s",x:Math.random()*W,y:-10-Math.random()*H,vy:28+Math.random()*30,vx:-8+Math.random()*16,r:1.2+Math.random()*2.3,ph:Math.random()*6}
    :{k:se===0?"p":"l",x:Math.random()*(W+200)-100,y:-20-Math.random()*H*.6,vy:se===0?22+Math.random()*18:30+Math.random()*25,vx:se===0?18+Math.random()*20:-10+Math.random()*20,r:se===0?3+Math.random()*2:5+Math.random()*3,rot:Math.random()*6,vr:-2+Math.random()*4,ph:Math.random()*6,
